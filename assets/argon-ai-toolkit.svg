<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#19163B"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle app base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="url(#border)" stroke-width="14"/>

  <!-- Subtle hexagonal tech ring -->
  <polygon points="256,78 408,166 408,346 256,434 104,346 104,166"
           fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Stylized Argon 'A' emblem -->
  <path d="M256 126 L364 366 L316 366 L292 308 L220 308 L196 366 L148 366 Z M256 196 L234 268 L278 268 Z"
        fill="url(#accent)" fill-rule="evenodd"/>

  <!-- Terminal prompt bar inside bottom -->
  <rect x="210" y="384" width="92" height="14" rx="7" fill="#38BDF8" fill-opacity="0.85"/>

  <!-- AI four-point spark accent (top-right) -->
  <path d="M372 104 C375 128 384 137 408 140 C384 143 375 152 372 176 C369 152 360 143 336 140 C360 137 369 128 372 104 Z"
        fill="url(#spark)"/>
</svg>
